name: Deploy to GitHub Pages
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install & build (if package.json)
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build || true
          fi

      - name: Detect publish directory
        run: |
          if [ -d build ]; then
            echo "PUBLISH_DIR=build" >> $GITHUB_ENV
          elif [ -d dist ]; then
            echo "PUBLISH_DIR=dist" >> $GITHUB_ENV
          elif [ -d public ]; then
            echo "PUBLISH_DIR=public" >> $GITHUB_ENV
          else
            echo "PUBLISH_DIR=." >> $GITHUB_ENV
          fi

      - name: Upload pages artifact
        # Use a modern release that does not depend on upload-artifact@v3
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
